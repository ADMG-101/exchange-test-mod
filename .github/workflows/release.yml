# Builds the mod package from mod/ for a version tag, attests it, and attaches it to a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the package (sorted entries, fixed timestamps)
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version mod/mod.json)" = "$version"
          cd mod
          find . -type f -exec touch -d '2026-01-01T00:00:00Z' {} +
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | zip -X -q "../exchange-test-mod-$version.zip" -@
          cd .. && echo "PACKAGE=exchange-test-mod-$version.zip" >> "$GITHUB_ENV"

      - name: Attest the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.PACKAGE }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$PACKAGE" --title "$GITHUB_REF_NAME" --notes "Staging test release."
