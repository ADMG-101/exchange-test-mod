# Builds, attests and publishes a GitHub release for every version tag (v1.2.3).
#
# ADMG Exchange discovers the release through the read-only ADMG Exchange GitHub App, checks it and queues it for
# review. Nothing is uploaded to Exchange and no token or secret is needed: the package, its build provenance and its
# SHA-256 all live on GitHub, tied to the exact commit you tagged.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release and attach the package
      id-token: write      # sign the build provenance (Sigstore, through GitHub)
      attestations: write  # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the project
        run: python3 .admg/package.py check

      # Mods with code: a C# project under src/ is built against the ADMG SDK reference kit (compile-time references
      # only) with a deterministic, SourceLink-enabled configuration, and its DLL is packaged from mod/.
      - name: Set up .NET (mods with code)
        if: hashFiles('src/**/*.csproj') != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build the mod's code (mods with code)
        if: hashFiles('src/**/*.csproj') != ''
        env:
          KIT_URL: ${{ vars.ADMG_SDK_KIT_URL }}
          KIT_SHA256: ${{ vars.ADMG_SDK_KIT_SHA256 }}
        run: |
          if [ -z "$KIT_URL" ] || [ -z "$KIT_SHA256" ]; then
            echo "::error::Mods with code need the ADMG SDK reference kit. Set the repository variables ADMG_SDK_KIT_URL and ADMG_SDK_KIT_SHA256 (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          curl -fsSL "$KIT_URL" -o "$RUNNER_TEMP/kit.zip"
          echo "$KIT_SHA256  $RUNNER_TEMP/kit.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/kit"
          kit="$(find "$RUNNER_TEMP/kit" -maxdepth 1 -mindepth 1 -type d | head -n 1)"
          mod_id="$(python3 -c "import json;print(json.load(open('mod/mod.json'))['id'])")"
          dotnet build src -c Release -o "$RUNNER_TEMP/build" \
            -p:EmeraldExpansionSdkKit="$kit" -p:ContinuousIntegrationBuild=true -p:Deterministic=true
          cp "$RUNNER_TEMP/build/$mod_id.dll" "mod/$mod_id.dll"

      - name: Package
        run: python3 .admg/package.py build --version "${GITHUB_REF_NAME#v}" --out dist

      - name: Verify the package digests
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built by \`${GITHUB_WORKFLOW_REF%@*}\` from commit $GITHUB_SHA."
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          # A draft first, so the release is complete before anyone sees it (and before an immutable release locks it).
          gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Check GitHub's digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' | sort > "$RUNNER_TEMP/github.sums"
          sort dist/SHA256SUMS | diff - "$RUNNER_TEMP/github.sums"
